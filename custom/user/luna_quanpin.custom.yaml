# luna_pinyin_simp.custom.yaml —— 朙月拼音·简化字：模糊音 + 9 候选
# 保存编码：UTF-8
patch:
  "menu/page_size": 9
  "speller/algebra":
    # ① 模糊音
    - "derive/^([zcs])h/$1/"           # zh/ch/sh => z/c/s
    - "derive/^([zcs])([^h])/$1h$2/"   # z/c/s => zh/ch/sh
    - "derive/^n/l/"                   # n => l
    - "derive/^l/n/"                   # l => n
    - "derive/([ei])n$/$1ng/"          # en=>eng, in=>ing
    - "derive/([ei])ng$/$1n/"          # eng=>en, ing=>in
    - "derive/^([bpmf])eng$/$1ong/"    # meng=mong, feng=fong …
    - "derive/an$/ang/"                # an=>ang, ian=>iang, uan=>uang
    - "derive/ang$/an/"                # ang=>an, iang=>ian, uang=>uan
    # ② 简拼（必须排在模糊音之后，否则简拼不享受模糊音）
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^([zcs]h).+$/$1/"
    # ③ 容错拼写（原有）
    - "derive/^([nl])ve$/$1ue/"
    - "derive/^([jqxy])u/$1v/"
    - "derive/un$/uen/"
    - "derive/ui$/uei/"
    - "derive/iu$/iou/"
    # ④ 按键纠错（原有）
    - "derive/([aeiou])ng$/$1gn/"
    - "derive/([dtngkhrzcs])o(u|ng)$/$1o/"
    - "derive/ong$/on/"
    - "derive/ao$/oa/"
    - "derive/([iu])a(o|ng?)$/a$1$2/"
