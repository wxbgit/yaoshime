# ┌──────────────────────────────────────────────────────────────────────┐
# │ luna_pinyin_simp.custom.yaml —— 朙月拼音·简化字 的补丁文件           │
# │ 作用：模糊音 + 简拼 + 容错拼写 + 按键纠错                            │
# └──────────────────────────────────────────────────────────────────────┘
#
# 【文件位置】C:\Users\HUAWEI\AppData\Roaming\Rime\
#            文件名必须叫 "<方案ID>.custom.yaml"，这里对应 luna_pinyin_simp
# 【作用范围】只影响「朙月拼音·简化字」这一个方案，不影响 luna_pinyin(繁体) 等
# 【生效方式】改完保存后必须「重新部署」才会生效
#            小狼毫：开始菜单 → 小狼毫输入法 → 重新部署（或托盘右键）
# 【验证方法】部署后打开同目录 build\luna_pinyin_simp.schema.yaml
#            看里面的 menu / speller 一节，确认改动被合入了
# 【出错排查】部署失败或方案不可用时，查 %APPDATA%\Rime\rime.log
#
# 【语法要求】
#   1. 必须保存为 UTF-8 编码，建议「无 BOM」
#   2. 缩进只能用空格，绝对不能用 Tab（YAML 会因 Tab 直接报错）
#   3. 以 # 开头的行为注释；行尾的 # 为行尾注释，都不参与解析
#   4. 想临时停用某条规则：在它前面加 # 注释掉即可，不必删除
#
# 【speller/algebra 的三个关键概念】
#   · 这是「拼写运算」列表，每条规则 format：指令/正则表达式/替换式/
#   · xform  ：改写，原拼写失效
#   · derive ：派生，新增一个等价拼写，原拼写保留 ← 模糊音用的就是这个
#   · abbrev ：新增一个「缩写」拼写              ← 简拼用的就是这个
#   · 求值顺序：从上到下依次执行，且前面产生的结果会参与后面的规则运算，
#     所以「规则顺序」是有实际影响的，不要随意打乱
#
# 【重要】这里的 "speller/algebra" 是「整体替换」方案自带的整个规则列表，
#         不是追加。因此上游原本的容错拼写（③）和纠错（④）也必须抄在这
#         里，否则一旦覆盖就会丢失。同理，"engine/..." 这类节点不要乱加，
#         小狼毫 0.17.4 已自带 table_translator@custom_phrase。
#
# ────────────────────────────────────────────────────────────────────────
patch:
  # 每页候选数。当前【已停用】，候选页数回到 default.yaml 的默认值（5）。
  # 需要 9 个候选时，把下一行行首的 # 删掉再重新部署即可。
  #"menu/page_size": 9

  # 拼写运算规则集（顺序敏感，勿随意调整分组顺序）
  "speller/algebra":

    # ═══════════════════════════════════════════════════════════════
    # ① 模糊音
    #    给每个音节派生出「读音相近」的备选拼写，打任一写法都能出字。
    #    全部都是双向的：下面每两条成一对，往返都通。
    #    代价：候选词会明显变多。若觉得太杂，按注释逐个删 trim 即可。
    # ═══════════════════════════════════════════════════════════════

    # 声母 翘舌 → 平舌：zh→z, ch→c, sh→s
    # 例：zhan 也当 zan 处理，打 zhang 能出「脏」；反之需看下面第二条
    #- "derive/^([zcs])h/$1/"           # zh/ch/sh => z/c/s

    # 声母 平舌 → 翘舌：z→zh, c→ch, s→sh
    # 注意 ([^h]) 要求 h 后面还得有一个字母，所以单字母音节不受影响
    # 例：zi→zhi、cao→chao、san→shan
    # ⚠ 这是候选膨胀的最大来源（打「zi」会冒出「之/只/知…」）
    #   若想精简，优先删掉这一条，保留上面那条单向即可
    #- "derive/^([zcs])([^h])/$1h$2/"   # z/c/s => zh/ch/sh

    # 声母 n → l：nan 也当 lan 处理
    - "derive/^n/l/"                   # n => l

    # 声母 l → n：lan 也当 nan 处理（上一条的反向）
    - "derive/^l/n/"                   # l => n

    # 韵母 前鼻音 → 后鼻音：en→eng、in→ing
    # 只作用于这两个独立韵母；uan/ian 等含 a 的不受影响（因为要求是 e 或 i）
    - "derive/([ei])n$/$1ng/"          # en=>eng, in=>ing

    # 韵母 后鼻音 → 前鼻音：eng→en、ing→in（上一条的反向）
    - "derive/([ei])ng$/$1n/"          # eng=>en, ing=>in

    # ong/eng 混读，且【限声母 b p m f】：meng→mong、feng→fong、beng/peng 同理
    # 之所以限定声母，是因为普通话里 b p m f 不与 ong 相拼，不会撞车
    # 单向即可：字典里只有 meng，派生出 mong，所以打 mong 也能出「梦」
    - "derive/^([bpmf])eng$/$1ong/"    # meng=mong, feng=fong …

    # 韵母 an → ang：得益于末尾锚点 $，连带 ian→iang、uan→uang 也生效
    - "derive/an$/ang/"                # an=>ang, ian=>iang, uan=>uang

    # 韵母 ang → an：连带 iang→ian、uang→uan（上一条的反向）
    - "derive/ang$/an/"                # ang=>an, iang=>ian, uang=>uan

    # ═══════════════════════════════════════════════════════════════
    # ② 简拼
    #    给音节再派生一个「首字母形式」，实现只打声母就能出词。
    #
    #    ⚠ 位置说明（这两条是有意放在 ① 之后的）：
    #      放在模糊音之后 ⇒ 派生出来的音节也会被缩写，于是「简拼也享受
    #      模糊音」，例如打 zh 能匹配到 zu 系的字。
    #      若把这两条挪到 ① 之前（即上游默认顺序），则简拼不享受模糊音，
    #      候选会干净很多。取舍按自己习惯，改完记得重新部署。
    # ═══════════════════════════════════════════════════════════════

    # 取整个音节的首字母：zhang→z、hao→h
    # 正则要求 .+ 至少一个字符，所以本来就是单字母的输入不会被处理
    - "abbrev/^([a-z]).+$/$1/"

    # 取完整翘舌声母：zhang→zh、chao→ch、shou→sh
    # 放在上一条之后，保证 "zh" 这种双字母简拼也被加入结果集
    - "abbrev/^([zcs]h).+$/$1/"

    # ═══════════════════════════════════════════════════════════════
    # ③ 容错拼写
    #    兼容同一音节的不同合法书写习惯。这几条来自上游官方配置，
    #    【不要删】，否则部分人的输入习惯会失效。
    # ═══════════════════════════════════════════════════════════════

    # nve/lve → nue/lue：ü 在键盘上常被写成 ve 或 ue
    - "derive/^([nl])ve$/$1ue/"

    # j/q/x/y 后面的 u 实为 ü，允许用 v 代替
    # 注意本条没有 $ 收尾，所以 juan→jvan 这类也一并生效
    - "derive/^([jqxy])u/$1v/"

    # un → uen：如 dun = duen
    - "derive/un$/uen/"

    # ui → uei：如 dui = duei
    - "derive/ui$/uei/"

    # iu → iou：如 jiu = jiou
    - "derive/iu$/iou/"

    # ═══════════════════════════════════════════════════════════════
    # ④ 按键纠错
    #    补救手指顺序打反 / 漏键。同样来自上游官方配置，建议保留。
    # ═══════════════════════════════════════════════════════════════

    # ng 打成 gn：ang→agn、eng→egn、ing→ign …
    - "derive/([aeiou])ng$/$1gn/"

    # 漏打韵尾：tou/tong 都当 to，dou/dong→do，nou/nong→no …（限 d t n g k h r z c s）
    - "derive/([dtngkhrzcs])o(u|ng?)$/$1o/"

    # ong 漏打 g：zhong→zhon、dong→don
    - "derive/ong$/on/"

    # ao 打反成 oa
    - "derive/ao$/oa/"

    # ia/ua 系列顺序打反：iao→aio、iang→aing、uan→aun、uang→aung
    # (o|ng?) 表示可匹配 o、n 或 ng 三种结尾
    - "derive/([iu])a(o|ng?)$/a$1$2/"
